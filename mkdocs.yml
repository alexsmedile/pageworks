# Generated by pageworks export mkdocs — edits will be preserved unless --force.
# To pin manual edits, add as the first line: # pageworks: do-not-overwrite
site_name: pageworks
site_description: Write docs that don't rot — Dual-Dimension Software Wiki & Renderer Pipelines
site_url: https://alexsmedile.github.io/pageworks/
repo_url: https://github.com/alexsmedile/pageworks
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/custom.css

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started & Onboarding:
      - Install Pageworks: getting-started/install.md
      - Quickstart Tutorial: getting-started/quickstart.md
      - Core Concepts: getting-started/concepts.md
  - Architecture & System Design:
      - Architecture Overview: architecture/overview.md
      - "ADR 0001: Migration to Spectacular v2": architecture/0001-spectacular-v2-migration.md
  - Services & Components:
      - CLI Binary — Service Catalog: services/cli.md
      - Skill Engine — Service Catalog: services/skill-engine.md
  - Operations & Reliability:
      - "Runbook: Exporting & Deploying Documentation": operations/export-runbook.md
      - "Runbook: 180-Day Stale Content Auditing": operations/maintenance-audit.md
  - API & Data Reference:
      - CLI Command Reference: reference/cli-reference.md
      - docs.yaml Manifest Schema: reference/manifest-schema.md
      - Page Frontmatter Specification: reference/frontmatter-spec.md
  - Standards & Governance:
      - Prose & Visual Standards: standards/prose-guidelines.md
      - Documentation Review Checklist: standards/review-checklist.md
